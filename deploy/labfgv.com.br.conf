server {
    listen 80;
    listen [::]:80;
    server_name labfgv.com.br www.labfgv.com.br;
    root /srv/minera-goias/current/public;
    index index.html;
    access_log /var/log/nginx/labfgv.com.br.access.log;
    error_log /var/log/nginx/labfgv.com.br.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location /api/ {
        proxy_pass http://127.0.0.1:18141;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
