name: Validate real model prototype

on:
  push:
    paths:
      - "Squad 2/modello_reale/**"
      - "Squad 2/intensidade_energetica/**"
      - "Squad 1/Bases consolidadas/documentacao/pacote_squad2/**"
      - "Squad 1/Bases consolidadas/documentacao/prototipo_bases_consolidadas_v17.xlsx"
      - ".github/workflows/validate-modelo-real.yml"
  pull_request:
    paths:
      - "Squad 2/modello_reale/**"
      - "Squad 2/intensidade_energetica/**"
      - "Squad 1/Bases consolidadas/documentacao/pacote_squad2/**"
      - "Squad 1/Bases consolidadas/documentacao/prototipo_bases_consolidadas_v17.xlsx"
      - ".github/workflows/validate-modelo-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-model:
    name: Validate real model prototype
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install real model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Squad 2/modello_reale/requirements.txt"

      - name: Read and validate Squad 1 data
        run: |
          python "Squad 2/modello_reale/src/common.py"

      - name: Run historical backtest
        run: |
          python "Squad 2/modello_reale/src/run_backtest.py"

      - name: Run future scenarios
        run: |
          python "Squad 2/modello_reale/src/run_future_scenarios.py"

      - name: Run intensity sensitivity analysis
        run: |
          python "Squad 2/modello_reale/src/run_intensity_sensitivity.py"

      - name: Publish backtest results
        uses: actions/upload-artifact@v6
        with:
          name: real-model-backtest
          path: Squad 2/modello_reale/outputs/backtest/
          if-no-files-found: error
          retention-days: 30

      - name: Publish future scenario results
        uses: actions/upload-artifact@v6
        with:
          name: real-model-future-scenarios
          path: Squad 2/modello_reale/outputs/future/
          if-no-files-found: error
          retention-days: 30

      - name: Publish intensity sensitivity results
        uses: actions/upload-artifact@v6
        with:
          name: real-model-intensity-sensitivity
          path: Squad 2/modello_reale/outputs/sensitivity/
          if-no-files-found: error
          retention-days: 30
