name: Validar plataforma web
on:
  push:
    paths: ['public/**', 'Squad 3/backend/**', 'tests/test_web.py', 'tests/test_atlas.py', 'tests/test_i18n.py', 'tests/test_load_anm.py', 'tests/test_radar_api.py', 'tests/test_radar_noticias.py', 'Squad 3/radar-noticias/**', 'Squad 3/database/**', 'data/atlas/**', 'data/panorama/**', 'tests/test_panorama.py', 'tests/test_simulador.py', 'tests/test_mercado.py', 'scripts/build_projetos_go.py', 'Squad 1/Dados brutos/Aluno Lucas Maia/**', 'Squad 1/Radar de Projetos/**', 'scripts/build_projetos_minerais_goias.py', 'tests/test_radar_projetos.py', 'tests/simulador.test.js', 'Squad 2/modello_reale/parameters/**', 'scripts/build_simulador_base.py', 'scripts/extract_atlas.py', 'deploy/requirements-vps.txt', 'data/mapa/**', 'scripts/build_mapa_base.py', 'scripts/mapa_camadas.json', 'tests/test_mapa.py', 'tests/mapa-dados.test.js', 'tests/mapa-shp.test.js', 'Squad 1/P3M/Recortado pelo polígono de Goiás/_indice_recorte.csv', 'Squad 1/P3M/inventario_p3m.csv', 'robo/**', 'tests/test_robo.py', 'Squad 1/Dados brutos/**', '.github/workflows/validate-web.yml']
  pull_request:
    paths: ['public/**', 'Squad 3/backend/**', 'tests/test_web.py', 'tests/test_atlas.py', 'tests/test_i18n.py', 'tests/test_load_anm.py', 'tests/test_radar_api.py', 'tests/test_radar_noticias.py', 'Squad 3/radar-noticias/**', 'Squad 3/database/**', 'data/atlas/**', 'data/panorama/**', 'tests/test_panorama.py', 'tests/test_simulador.py', 'tests/test_mercado.py', 'scripts/build_projetos_go.py', 'Squad 1/Dados brutos/Aluno Lucas Maia/**', 'Squad 1/Radar de Projetos/**', 'scripts/build_projetos_minerais_goias.py', 'tests/test_radar_projetos.py', 'tests/simulador.test.js', 'Squad 2/modello_reale/parameters/**', 'scripts/build_simulador_base.py', 'scripts/extract_atlas.py', 'deploy/requirements-vps.txt', 'data/mapa/**', 'scripts/build_mapa_base.py', 'scripts/mapa_camadas.json', 'tests/test_mapa.py', 'tests/mapa-dados.test.js', 'tests/mapa-shp.test.js', 'Squad 1/P3M/Recortado pelo polígono de Goiás/_indice_recorte.csv', 'Squad 1/P3M/inventario_p3m.csv', 'robo/**', 'tests/test_robo.py', 'Squad 1/Dados brutos/**', '.github/workflows/validate-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r deploy/requirements-vps.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -p test_web.py -v
      - run: python -m unittest discover -s tests -p test_atlas.py -v
      - run: python -m unittest discover -s tests -p test_panorama.py -v
      - run: python -m unittest discover -s tests -p test_simulador.py -v
      - run: python -m unittest discover -s tests -p test_mercado.py -v
      - run: python -m unittest discover -s tests -p test_radar_projetos.py -v
      - run: python -m unittest discover -s tests -p test_mapa.py -v
      - run: python -m unittest discover -s tests -p test_robo.py -v
      - run: python -m unittest discover -s tests -p test_i18n.py -v
      - run: python -m unittest discover -s tests -p test_load_anm.py -v
      - run: python -m unittest discover -s tests -p test_radar_api.py -v
      - run: python -m unittest discover -s tests -p test_radar_noticias.py -v
      - run: node --check public/radar.js && node --check public/mercado.js && node --check public/processes.js && node --check public/i18n.js && node --check public/atlas.js && node --check public/panorama-charts.js && node --check public/panorama-cards1.js && node --check public/panorama-cards2.js && node --check public/panorama-cards3.js && node --check public/panorama-analises.js && node --check public/panorama.js && node --check public/painel.js && node --check public/login.js && node --check public/landing.js && node --check public/simulador.js && node --check public/simulador-engine.js && node --check public/mapa-dados.js && node --check public/mapa-shp.js && node --check public/mapa.js
      - run: node tests/simulador.test.js
      - run: node tests/mapa-dados.test.js
      - run: node tests/mapa-shp.test.js
