name: Validar importador de dados
on:
  push:
    paths: ['ingestion/**', 'tests/test_ingestion.py', '.github/workflows/validate-ingestion.yml']
  pull_request:
    paths: ['ingestion/**', 'tests/test_ingestion.py', '.github/workflows/validate-ingestion.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
