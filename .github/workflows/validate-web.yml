name: Validar plataforma web
on:
  push:
    paths: ['public/**', 'Squad 3/backend/**', 'tests/test_web.py', 'tests/test_atlas.py', 'tests/test_i18n.py', 'data/atlas/**', 'scripts/extract_atlas.py', 'deploy/requirements-vps.txt', '.github/workflows/validate-web.yml']
  pull_request:
    paths: ['public/**', 'Squad 3/backend/**', 'tests/test_web.py', 'tests/test_atlas.py', 'tests/test_i18n.py', 'data/atlas/**', 'scripts/extract_atlas.py', 'deploy/requirements-vps.txt', '.github/workflows/validate-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r deploy/requirements-vps.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -p test_web.py -v
      - run: python -m unittest discover -s tests -p test_atlas.py -v
      - run: python -m unittest discover -s tests -p test_i18n.py -v
      - run: node --check public/i18n.js && node --check public/atlas.js && node --check public/painel.js && node --check public/login.js && node --check public/landing.js
